{% extends 'base.html' %}

{% block title %}Login - Gausewa{% endblock %}

{% block extra_css %}
<style>
    .login-bg-img {
        position: absolute;
        right: 0;
        top: 12px;
        width: 586px;
        height: 754px;
        z-index: 1;
        pointer-events: none;
    }

    .login-logo {
        position: absolute;
        left: -90px;
        top: -18px;
        width: 488px;
        height: 157px;
        z-index: 2;
        pointer-events: none;
    }

    .login-logo-text {
        position: absolute;
        left: 160px;
        top: 59px;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 24px;
        color: #000;
        z-index: 3;
    }

    .login-welcome {
        position: absolute;
        left: 120px;
        top: 170px;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 32px;
        color: #000;
        z-index: 3;
    }

    .login-desc {
        position: absolute;
        left: 147px;
        top: 210px;
        font-family: 'Inter', sans-serif;
        font-weight: 300;
        font-size: 24px;
        color: #000;
        z-index: 3;
    }

    .login-form-container {
        position: absolute;
        left: 80px;
        top: 321px;
        width: 557px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 8px;
        box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.10);
        padding: 30px 30px 24px 30px;
        z-index: 4;
        border: 1px solid #fff;
    }

    .login-form-label {
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        font-size: 16px;
        color: #000;
        margin-bottom: 8px;
    }

    .login-form-input {
        width: 100%;
        border: 1px solid #d9d9d9;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        margin-bottom: 16px;
        background: #fff;
    }

    .login-btn {
        width: 100%;
        background: #2c2c2c;
        color: #fff;
        border: 1px solid #2c2c2c;
        border-radius: 8px;
        padding: 12px;
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 16px;
        transition: background 0.2s;
    }

    .login-btn:hover {
        background: #444;
    }

    .login-register-link {
        text-align: center;
        margin-top: 8px;
        font-size: 15px;
        color: #333;
    }

    .login-register-link a {
        color: #2c2c2c;
        font-weight: 600;
        text-decoration: underline;
    }

    @media (max-width: 900px) {

        .login-bg-img,
        .login-logo,
        .login-logo-text,
        .login-welcome,
        .login-desc,
        .login-form-container {
            position: static !important;
            width: 100% !important;
            left: 0 !important;
            top: 0 !important;
            margin: 0 auto !important;
        }

        .login-form-container {
            margin-top: 30px !important;
        }
    }
</style>
{% endblock %}

{% block content %}
<div style="position:relative; min-height:900px;">
    <img src="https://www.figma.com/api/mcp/asset/ce49fa3b-d837-4457-8f31-71ff0ecc4b16" alt="background"
        class="login-bg-img" />
    <img src="https://www.figma.com/api/mcp/asset/1be77ec0-97af-4bf1-99ca-4a5b5bea653e" alt="logo" class="login-logo" />
    <div class="login-logo-text">Gau Sewa</div>
    <div class="login-welcome">Welcome Back !</div>
    <div class="login-desc">Please enter log in details below</div>
    <div class="login-form-container">
        <form method="post" action="{% url 'login' %}">
            {% csrf_token %}
            <label for="phone" class="login-form-label">Phone Number</label>
            <input type="text" id="phone" name="phone" class="login-form-input" placeholder="Enter your phone number"
                required />
            <label for="password" class="login-form-label">Password</label>
            <input type="password" id="password" name="password" class="login-form-input"
                placeholder="Enter your password" required />
            <button type="submit" class="login-btn">Login</button>
        </form>
        <div class="login-register-link">
            Don't have an account? <a href="{% url 'register' %}">Register Now</a>
        </div>
    </div>
</div>
{% endblock %}
