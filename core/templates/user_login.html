{% extends 'base.html' %}

{% block title %}Login - Gausewa{% endblock %}

{% block extra_css %}
<style>
    .login-bg-img {
        position: absolute;
        right: 0;
        top: 12px;
        width: 586px;
        height: 754px;
        z-index: 1;
        pointer-events: none;
    }

    .login-logo {
        position: absolute;
        left: -90px;
        top: -18px;
        width: 488px;
        height: 157px;
        z-index: 2;
        pointer-events: none;
    }

    .login-logo-text {
        position: absolute;
        left: 160px;
        top: 59px;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 24px;
        color: #000;
        z-index: 3;
    }

    .login-welcome {
        position: absolute;
        left: 120px;
        top: 170px;
        font-family: 'Inter', sans-serif;
        font-weight: 600;
        font-size: 32px;
        color: #000;
        z-index: 3;
    }

    .login-desc {
        position: absolute;
        left: 147px;
        top: 210px;
        font-family: 'Inter', sans-serif;
        font-weight: 300;
        font-size: 24px;
        color: #000;
        z-index: 3;
    }

    .login-form-container {
        position: absolute;
        left: 80px;
        top: 321px;
        width: 557px;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 8px;
        box-shadow: 0 4px 24px 0 rgba(0, 0, 0, 0.10);
        padding: 30px 30px 24px 30px;
        z-index: 4;
        border: 1px solid #fff;
    }

    .login-form-label {
        font-family: 'Inter', sans-serif;
        font-weight: 400;
        font-size: 16px;
        color: #000;
        margin-bottom: 8px;
    }

    .login-form-input {
        width: 100%;
        border: 1px solid #d9d9d9;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 16px;
        margin-bottom: 16px;
        background: #fff;
    }

    .login-btn {
        width: 100%;
        background: #2c2c2c;
        color: #fff;
        border: 1px solid #2c2c2c;
        border-radius: 8px;
        padding: 12px;
        font-size: 16px;
        font-weight: 600;
    .login-btn:hover {
        background: #444;
    }

    .login-register-link {
        text-align: center;
        margin-top: 8px;
        font-size: 15px;
        color: #333;
    }

    .login-register-link a {
        color: #2c2c2c;
        font-weight: 600;
        text-decoration: underline;
    }

    .otp-section {
        display: none;
    }

    .otp-section.active {
        display: block;
    }

    .phone-section.hidden {
        display: none;
    }

    .resend-otp {
        text-align: center;
        margin-top: 16px;
        font-size: 14px;
        color: #666;
    }

    .resend-otp button {
        background: none;
        border: none;
        color: #2c2c2c;
        font-weight: 600;
        text-decoration: underline;
        cursor: pointer;
        padding: 0;
    }

    .resend-otp button:disabled {
        color: #999;
        cursor: not-allowed;
    }

    .alert {
        padding: 12px;
        margin-bottom: 16px;
        border-radius: 8px;
    }

    .alert-error {
        background-color: #fee;
        color: #c33;
        border: 1px solid #fcc;
    }

    .alert-success {
        background-color: #efe;
        color: #3c3;
        border: 1px solid #cfc;
    }

    @media (max-width: 900px) {

        .login-bg-img,
        .login-logo,
        .login-logo-text,
        .login-welcome,
        .login-desc,
        .login-form-container {
            position: static !important;
            width: 100% !important;
            left: 0 !important;
            top: 0 !important;
            margin: 0 auto !important;
        }

        .login-form-container {
            margin-top: 30px !important;
        }
    }
</style>
{% endblock %}

{% block content %}
<div style="position:relative; min-height:900px;">
    <img src="https://www.figma.com/api/mcp/asset/ce49fa3b-d837-4457-8f31-71ff0ecc4b16" alt="background"
        class="login-bg-img" />
    <img src="https://www.figma.com/api/mcp/asset/1be77ec0-97af-4bf1-99ca-4a5b5bea653e" alt="logo" class="login-logo" />
    <div class="login-logo-text">Gau Sewa</div>
    <div class="login-welcome">Welcome Back !</div>
    <div class="login-desc">Please enter your phone number</div>
    <div class="login-form-container">
        <div id="message-container"></div>
        
        <!-- Phone Number Section -->
        <div class="phone-section" id="phoneSection">
            <form id="phoneForm">
                {% csrf_token %}
                <label for="phone_number" class="login-form-label">Phone Number</label>
                <input type="tel" id="phone_number" name="phone_number" class="login-form-input" 
                    placeholder="Enter your phone number (e.g., 9841234567)" 
                    pattern="[0-9]{10}" 
                    required />
                <button type="submit" class="login-btn" id="sendOtpBtn">Send OTP</button>
            </form>
        </div>

        <!-- OTP Section -->
        <div class="otp-section" id="otpSection">
            <form id="otpForm">
                {% csrf_token %}
                <input type="hidden" id="hidden_phone_number" name="phone_number" />
                <label for="otp_code" class="login-form-label">Enter OTP</label>
                <input type="text" id="otp_code" name="otp_code" class="login-form-input" 
                    placeholder="Enter 6-digit OTP" 
                    maxlength="6"
                    pattern="[0-9]{6}" 
                    required />
                <button type="submit" class="login-btn" id="verifyOtpBtn">Verify OTP</button>
            </form>
            <div class="resend-otp">
                <button type="button" id="resendOtpBtn">Resend OTP</button> or 
                <button type="button" id="changePhoneBtn">Change Phone Number</button>
            </div>
        </div>

        <div class="login-register-link">
            Don't have an account? <a href="{% url 'register' %}">Register Now</a>
        </div>
    </div>
</div>

<script>
    const phoneForm = document.getElementById('phoneForm');
    const otpForm = document.getElementById('otpForm');
    const phoneSection = document.getElementById('phoneSection');
    const otpSection = document.getElementById('otpSection');
    const messageContainer = document.getElementById('message-container');
    const sendOtpBtn = document.getElementById('sendOtpBtn');
    const verifyOtpBtn = document.getElementById('verifyOtpBtn');
    const resendOtpBtn = document.getElementById('resendOtpBtn');
    const changePhoneBtn = document.getElementById('changePhoneBtn');
    
    let currentPhoneNumber = '';

    function showMessage(message, isError = false) {
        messageContainer.innerHTML = `
            <div class="alert ${isError ? 'alert-error' : 'alert-success'}">
                ${message}
            </div>
        `;
        setTimeout(() => {
            messageContainer.innerHTML = '';
        }, 5000);
    }

    function showOtpSection(phoneNumber) {
        phoneSection.classList.add('hidden');
        otpSection.classList.add('active');
        currentPhoneNumber = phoneNumber;
        document.getElementById('hidden_phone_number').value = phoneNumber;
        document.querySelector('.login-desc').textContent = `OTP sent to ${phoneNumber}`;
    }

    function showPhoneSection() {
        phoneSection.classList.remove('hidden');
        otpSection.classList.remove('active');
        document.querySelector('.login-desc').textContent = 'Please enter your phone number';
        document.getElementById('otp_code').value = '';
    }

    phoneForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const phoneNumber = document.getElementById('phone_number').value;
        sendOtpBtn.disabled = true;
        sendOtpBtn.textContent = 'Sending...';

        try {
            const formData = new FormData();
            formData.append('phone_number', phoneNumber);
            formData.append('csrfmiddlewaretoken', document.querySelector('[name=csrfmiddlewaretoken]').value);

            const response = await fetch('{% url "send_otp" %}', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                showMessage(data.message, false);
                showOtpSection(phoneNumber);
            } else {
                showMessage(data.message, true);
            }
        } catch (error) {
            showMessage('An error occurred. Please try again.', true);
        } finally {
            sendOtpBtn.disabled = false;
            sendOtpBtn.textContent = 'Send OTP';
        }
    });

    otpForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const otpCode = document.getElementById('otp_code').value;
        verifyOtpBtn.disabled = true;
        verifyOtpBtn.textContent = 'Verifying...';

        try {
            const formData = new FormData();
            formData.append('phone_number', currentPhoneNumber);
            formData.append('otp_code', otpCode);
            formData.append('csrfmiddlewaretoken', document.querySelector('#otpForm [name=csrfmiddlewaretoken]').value);

            const response = await fetch('{% url "verify_otp" %}', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();

            if (data.success) {
                showMessage(data.message, false);
                setTimeout(() => {
                    window.location.href = data.redirect_url;
                }, 1000);
            } else {
                showMessage(data.message, true);
                verifyOtpBtn.disabled = false;
                verifyOtpBtn.textContent = 'Verify OTP';
            }
        } catch (error) {
            showMessage('An error occurred. Please try again.', true);
            verifyOtpBtn.disabled = false;
            verifyOtpBtn.textContent = 'Verify OTP';
        }
    });

    resendOtpBtn.addEventListener('click', async () => {
        resendOtpBtn.disabled = true;
        const originalText = resendOtpBtn.textContent;
        resendOtpBtn.textContent = 'Sending...';

        try {
            const formData = new FormData();
            formData.append('phone_number', currentPhoneNumber);
            formData.append('csrfmiddlewaretoken', document.querySelector('#otpForm [name=csrfmiddlewaretoken]').value);

            const response = await fetch('{% url "send_otp" %}', {
                method: 'POST',
                body: formData
            });

            const data = await response.json();
            showMessage(data.message, !data.success);
        } catch (error) {
            showMessage('An error occurred. Please try again.', true);
        } finally {
            setTimeout(() => {
                resendOtpBtn.disabled = false;
                resendOtpBtn.textContent = originalText;
            }, 30000); // Disable for 30 seconds
        }
    });

    changePhoneBtn.addEventListener('click', () => {
        showPhoneSection();
        document.getElementById('phone_number').value = '';
    });
</script>
{% endblock %}
