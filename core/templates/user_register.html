{% block title %}Register - Gausewa{% endblock %}

{% block extra_css %}

{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="auth-card mx-auto">
                    <div class="auth-header">
                        <div class="auth-icon">
                            <i class="fas fa-user-plus"></i>
                        </div>
                        <h2>Create Account</h2>
                        <p>Join Gausewa today</p>
                    </div>
                    
                    <div class="auth-body">
                        <form method="post" action="{% url 'user_register' %}">
                            {% csrf_token %}
                            
                            <div class="form-group">
                                <label class="form-label" for="username">
                                    <i class="fas fa-user"></i> Username *
                                </label>
                                <input type="text" class="form-control" id="username" name="username" required />
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="email">
                                    <i class="fas fa-envelope"></i> Email *
                                </label>
                                <input type="email" class="form-control" id="email" name="email" required />
                            </div>
                            
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="form-label" for="phone_number">
                                            <i class="fas fa-phone"></i> Phone Number *
                                        </label>
                                        <input type="tel" class="form-control" id="phone_number" name="phone_number" 
                                               value="{{ prefill_phone }}" pattern="[0-9]{10}" required />
                                    </div>
                                </div>
                                
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="form-label" for="district">
                                            <i class="fas fa-map-marker-alt"></i> District *
                                        </label>
                                        <input type="text" class="form-control" id="district" name="district" required />
                                    </div>
                                </div>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="password1">
                                    <i class="fas fa-lock"></i> Password *
                                </label>
                                <input type="password" class="form-control" id="password1" name="password1" 
                                       minlength="8" required />
                                <small class="form-text">
                                    Password must be at least 8 characters long.
                                </small>
                            </div>
                            
                            <div class="form-group">
                                <label class="form-label" for="password2">
                                    <i class="fas fa-lock"></i> Confirm Password *
                                </label>
                                <input type="password" class="form-control" id="password2" name="password2" 
                                       minlength="8" required />
                            </div>
                            
                            <button type="submit" class="btn btn-register">
                                <i class="fas fa-user-plus"></i> Create Account
                            </button>
                        </form>
                        
                        <div class="divider">
                            <span>or</span>
                        </div>
                        
                        <div class="login-link">
                            Already have an account? <a href="{% url 'user_login' %}">Login here</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
